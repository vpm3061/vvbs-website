<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Reader – VVBS Digital Media</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .reader-header {
      background: var(--primary);
      padding: 1rem 0;
      border-bottom: 1px solid rgba(0,200,255,0.2);
    }
    .reader-container {
      padding: 2rem 5%;
    }
    .pdf-frame {
      width: 100%;
      height: 80vh;
      border: none;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .paper-info {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border-radius: 10px;
    }
    .back-btn {
      margin-right: 1rem;
    }
  </style>
</head>
<body>
  <div class="circuit-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="reader-header">
    <div class="container">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="library.html" class="btn back-btn"><i class="fas fa-arrow-left"></i> Back to Library</a>
        <span class="logo-text">VVBS Digital Reader</span>
      </div>
    </div>
  </div>

  <main>
    <div class="reader-container">
      <div id="paperInfo" class="paper-info">
        <h2 id="paperTitle" style="color: var(--accent); margin-bottom: 0.5rem;"></h2>
        <p id="paperMeta" style="color: #a0a8c0;"></p>
      </div>
      
      <div id="pdfViewer">
        <!-- PDF iframe will be inserted here -->
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2025 VVBS Digital Media Management & IT Network. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Get paper info from sessionStorage
    const paperData = JSON.parse(sessionStorage.getItem('currentPaper'));
    
    if (!paperData) {
      // No paper selected, redirect to library
      window.location.href = 'library.html';
    } else {
      // Display paper info
      document.getElementById('paperTitle').textContent = paperData.title;
      
      // Create embed URL
      const embedUrl = `https://drive.google.com/file/d/${paperData.fileId}/preview`;
      
      // Create iframe
      const pdfViewer = document.getElementById('pdfViewer');
      pdfViewer.innerHTML = `
        <iframe src="${embedUrl}" class="pdf-frame" allowfullscreen allow="autoplay"></iframe>
      `;
      
      // Try to fetch more paper details from library.json (optional)
      fetch('library.json')
        .then(res => res.json())
        .then(data => {
          // Search for this paper in the data
          for (const cat of data.categories) {
            const paper = cat.papers.find(p => p.fileId === paperData.fileId);
            if (paper) {
              document.getElementById('paperMeta').textContent = `${paper.authors || 'VVBS Research'} • ${paper.date || 'N/A'} • ${paper.pages || '?'} pages`;
              break;
            }
          }
        })
        .catch(() => {
          document.getElementById('paperMeta').textContent = 'VVBS Research Publication';
        });
    }
  </script>
</body>
</html>
